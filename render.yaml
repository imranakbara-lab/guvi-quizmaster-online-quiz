# Render Blueprint: backend API + free PostgreSQL database
services:
  - type: web
    name: quizmaster-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizmaster-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://guvi-quizmaster-online-quiz.vercel.app
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: quizmaster-db
    databaseName: quizmaster
    plan: free
