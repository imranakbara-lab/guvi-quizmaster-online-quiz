spring.application.name=quizmaster-backend
server.port=${PORT:8080}

# ---------- Database ----------
# Local run uses an in-memory H2 database (no setup needed).
# For deployment set DATABASE_URL (Render) or DB_URL, DB_USERNAME, DB_PASSWORD, e.g.
#   MySQL:      jdbc:mysql://host:3306/quizmaster
#   PostgreSQL: jdbc:postgresql://host:5432/quizmaster
spring.datasource.url=${DB_URL:jdbc:h2:mem:quizmaster;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:quizmaster-dev-secret-key-change-this-in-production-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Default admin + sample quizzes (created on first start) ----------
app.admin.email=${ADMIN_EMAIL:admin@quizmaster.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-sample-quizzes=${SEED_SAMPLE_QUIZZES:true}

# ---------- CORS (comma separated frontend URLs) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app,https://*.netlify.app}

# ---------- Email (Spring Boot Starter Mail) ----------
# Set MAIL_ENABLED=true and the SMTP settings to send real emails (e.g. Gmail with an App Password).
# When disabled, emails are printed to the log.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:QuizMaster <no-reply@quizmaster.app>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
